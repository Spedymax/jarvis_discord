[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-bot"
version = "0.1.0"
description = "Discord music bot powered by Lavalink"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.4,<3",
    "wavelink>=3.4,<4",
    "aiosqlite>=0.20,<1",
    "python-dotenv>=1.0,<2",
    "pillow>=10,<12",
    "yt-dlp>=2024.10",
    "sentry-sdk>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]