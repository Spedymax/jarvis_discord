name: Release hotkey client

on:
  push:
    branches: [main]
    paths: ["hotkey-client/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotkey-client-release
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hotkey-client/requirements.txt

      - name: Install deps
        run: pip install -r hotkey-client/requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --collect-all customtkinter
          --collect-all pynput --collect-all pystray
          --name jarvis-hotkeys hotkey-client/client.py

      # Тег hotkey-client-latest остаётся на первом SHA — это ок: ссылка
      # на скачивание привязана к release-объекту, asset обновляется --clobber.
      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hotkey-client-latest >/dev/null 2>&1 || \
            gh release create hotkey-client-latest \
              --title "Hotkey client (latest)" \
              --notes "Автосборка клиента хоткеев. Скачай jarvis-hotkeys.exe и запусти."
          gh release upload hotkey-client-latest dist/jarvis-hotkeys.exe --clobber
