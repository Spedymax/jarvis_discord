server:
  port: 2333
  address: 0.0.0.0

plugins:
  lavasrc:
    providers:
      # ytsearch: обслуживается yt-dlp source (см. sources.ytdlp), не youtube-plugin
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      ytdlp: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "US"
      playlistLoadLimit: 100
      albumLoadLimit: 100
      preferAnonymousToken: false
    ytdlp:
      path: "/usr/local/bin/yt-dlp"
      searchLimit: 10
      playlistLoadLimit: 100
      mixPlaylistLoadLimit: 25

  # youtube-plugin выключен — YouTube ломает его быстрее, чем выходят релизы
  # (SABR-only форматы, cipher, bot-check). YouTube обслуживает yt-dlp через lavasrc.
  # Откат: enabled: true + lavasrc sources.ytdlp: false.
  youtube:
    enabled: false

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    # оставлен выключенным (plugins.youtube.enabled: false) для быстрого отката
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
  pluginsDir: "/opt/Lavalink/plugins"
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: false
      local: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

logging:
  file:
    path: "/var/log/lavalink/"
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7